version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: moneypilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: moneypilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - moneypilot_pgdata:/var/lib/postgresql/data

volumes:
  moneypilot_pgdata:
